global:
  scrape_interval: 15s        # как часто опрашивать цели
  evaluation_interval: 15s    # как часто вычислять правила

scrape_configs:
  - job_name: prometheus            # метрики самого Prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: node            # метрики виртуальных машин
    static_configs:
      - targets: ['192.168.252.6:9100']
        labels:
          instance: vm1

      - targets: ['192.168.252.7:9100']
        labels:
          instance: vm2
      
      - targets: ['host.docker.internal:9100']
        labels:
          instance: vm3
